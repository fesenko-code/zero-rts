<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZERO — Ancient Warfare RTS</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0c0f14;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        color: #e8e8e8;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas { display: block; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        letter-spacing: 2px;
        color: #9bd1a8;
        background: #0c0f14;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading">ZERO — loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
